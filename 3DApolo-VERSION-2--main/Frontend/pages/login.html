<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apolo 3D · Acceso</title>
  <link rel="stylesheet" href="../css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="fondo">
    <svg class="capa suave" viewBox="0 0 1000 600" preserveAspectRatio="none">
      <path d="M 0 0 L 300 0 C 380 60, 450 180, 520 240 C 650 320, 850 280, 1000 320 L 1000 0 Z"/>
    </svg>
    <svg class="capa fuerte" viewBox="0 0 1000 600" preserveAspectRatio="none">
      <path d="M 0 0 L 220 0 C 300 40, 360 140, 420 200 C 550 260, 750 220, 1000 260 L 1000 0 Z"/>
    </svg>
  </div>

  <div class="wrap">

    <div class="card">

      <div class="brand">
        <img src="../img/icono_user.png" alt="Apolo 3D" class="logo">
        <h1>Apolo <span>3D</span></h1>
        <p>Sistema de inventario · Personal autorizado</p>
      </div>

      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Tu usuario" autocomplete="username">
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <div class="pass-wrap">
          <input type="password" id="contrasena" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="ojo" id="btnOjo" onclick="togglePass()">👁</button>
        </div>
      </div>

      <p class="error" id="error"></p>

      <button class="btn" id="btnLogin">Entrar</button>

      <a href="/" class="volver">← Volver al inicio</a>

    </div>

  </div>

  <script src="../js/login.js"></script>

</body>
</html>
